# Blueprint deploy — uses Docker so Render never mis-detects Ruby.
services:
  - type: web
    name: foreigners-club-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: DATABASE_URL
        value: file:/var/data/app.db
    disk:
      name: foreigners-club-data
      mountPath: /var/data
      sizeGB: 1
