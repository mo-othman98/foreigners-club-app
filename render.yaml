# Blueprint deploy — uses Docker so Render never mis-detects Ruby.
services:
  - type: web
    name: foreigners-club-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: DATABASE_URL
        value: file:/var/data/app.db
      - key: AUTH_SECRET
        generateValue: true
      - key: ADMIN_SECRET
        generateValue: true
      - key: AUTH_DEV_CODES
        value: "false"
      - key: ADMIN_EMAILS
        value: "mo-othman98@hotmail.com"
      - key: AUTH_REQUIRE_EMAIL_VERIFICATION
        value: "false"
      - key: AUTH_FROM_EMAIL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: APP_REVIEW_EMAIL
        sync: false
      - key: APP_REVIEW_PASSWORD
        sync: false
      - key: APP_REVIEW_NAME
        value: "App Reviewer"
      - key: GOOGLE_CLIENT_ID
        value: "718934773512-8b361k96cd4en9j5laal5thcbkqofun3.apps.googleusercontent.com"
      - key: GOOGLE_IOS_CLIENT_ID
        value: "718934773512-d0b65juo9db5o8os6b00b7u9ncv3i6d1.apps.googleusercontent.com"
    disk:
      name: foreigners-club-data
      mountPath: /var/data
      sizeGB: 1
