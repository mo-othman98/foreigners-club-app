# Blueprint deploy — uses Docker so Render never mis-detects Ruby.
services:
  - type: web
    name: foreigners-club-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: DATABASE_URL
        value: file:/var/data/app.db
      - key: AUTH_SECRET
        generateValue: true
      - key: ADMIN_SECRET
        generateValue: true
      - key: AUTH_DEV_CODES
        value: "false"
      - key: ADMIN_EMAILS
        value: "mo-othman98@hotmail.com"
      - key: AUTH_FROM_EMAIL
        sync: false
      - key: RESEND_API_KEY
        sync: false
    disk:
      name: foreigners-club-data
      mountPath: /var/data
      sizeGB: 1
